{% extends 'base.html' %}
{% block content %}
<h1>Domains</h1>
<section class="card">
  <form method="get" class="filters">
    <input name="q" placeholder="domain, keyword, registrar" value="{{ filters.get('q','') }}">
    <select name="category"><option value="">All categories</option>{% for c in categories %}<option value="{{ c }}" {% if filters.get('category')==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select>
    <select name="status"><option value="">All statuses</option>{% for s in statuses %}<option value="{{ s }}" {% if filters.get('status')==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select>
    <select name="month"><option value="">All months</option>{% for m in months %}<option value="{{ loop.index }}" {% if filters.get('month')==loop.index %}selected{% endif %}>{{ m }}</option>{% endfor %}</select>
    <input name="rating_min" type="number" min="0" max="100" placeholder="rating >" value="{{ filters.get('rating_min','') }}">
    <button>Search</button>
  </form>
</section>
<section class="grid two">
  <form action="/manual" method="post" class="card stack"><h2>Add domain</h2><input name="domain" placeholder="example.com"><input name="expiration_date" placeholder="2026-06-01"><select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select><button>Add</button></form>
  <form action="/recheck" method="post" class="card stack"><h2>Manual recheck</h2><input name="group" placeholder="all, crypto, march, pendingdelete"><button>Recheck selected group</button></form>
</section>
<section class="card">{% with domains=domains %}{% include '_table.html' %}{% endwith %}</section>
{% endblock %}
